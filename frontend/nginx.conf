# Rate limit per real client IP (Cloudflare sets CF-Connecting-IP), falling back to the peer.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}
limit_req_zone $client_key zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS, resolved per request so the static site still starts and serves if the API is down.
    resolver 127.0.0.11 valid=10s;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Preview tokens travel in these paths: never write them to access logs.
    location ^~ /api/preview/ {
        access_log off;
        limit_req zone=api burst=20 nodelay;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location ^~ /preview/ {
        access_log off;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex" always;
        try_files /index.html =404;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        set $upstream http://api:8000;
        proxy_pass $upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Reserved for the future admin dashboard (Phase 4). Not served in Phase 1.
    location ^~ /admin {
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
