name: Deploy

# Runs on the Raspberry Pi self-hosted runner ONLY for commits already on main whose CI passed.
# It is never triggered by pull requests, so untrusted code cannot reach the privileged runner.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, ARM64, muda-prod]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      # Runtime secrets live only in /opt/muda/.env on the Pi, never in GitHub.
      - name: Sync sources (keeps .env and volumes)
        run: rsync -a --delete --exclude '.env' --exclude '.git' --exclude '.github' ./ /opt/muda/
      - name: Build and restart
        working-directory: /opt/muda
        run: docker compose up -d --build --remove-orphans
      - name: Wait for the API to be healthy
        working-directory: /opt/muda
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' muda-api-1 2>/dev/null || true)
            [ "$status" = "healthy" ] && exit 0
            sleep 4
          done
          docker compose logs --tail 50 api
          exit 1
      - name: Prune old images
        run: docker image prune -f
