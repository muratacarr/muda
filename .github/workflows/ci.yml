name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository. No secrets are used here, so pull requests
# from forks are safe to run. Never add `pull_request_target` or a self-hosted runner to this file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests
      - run: uv run pytest -q
      - run: uv run pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose file
        run: |
          PREVIEW_SECRET=x PUBLIC_BASE_URL=https://example.com TELEGRAM_BOT_TOKEN=x \
          TELEGRAM_ALLOWED_USER_ID=1 DEEPSEEK_API_KEY=x TUNNEL_TOKEN=x \
          docker compose config --quiet
      - name: Build backend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/arm64
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
